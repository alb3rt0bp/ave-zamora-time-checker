AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Zamora Train Observability
  Data Lake de puntualidad de trenes Alvia/Intercity en la estación de Zamora.
  Arquitectura: EventBridge Scheduler → Lambda (cada 5 min) → S3 Data Lake + DynamoDB.

# ══════════════════════════════════════════════════════════════════════════════
# PARÁMETROS
# ══════════════════════════════════════════════════════════════════════════════
Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Entorno de despliegue

  AwsRegion:
    Type: String
    Default: eu-south-2
    Description: >
      Región AWS del despliegue. Debe coincidir con la región donde se
      despliega el stack (usada en los widgets del Dashboard y la URL).

  ZamoraStationCode:
    Type: String
    Default: "30200"
    Description: >
      Código de estación Zamora en el sistema Renfe.
      Verificar contra codEstAnt en flotaLD.json.

  ChamartinStationCode:
    Type: String
    Default: "17000"
    Description: >
      Código de estación Madrid Chamartín en el sistema Renfe.
      Usado para detectar la llegada de los trenes con sentido Madrid.
      Verificar contra codEstAnt en flotaLD.json.

  PollingWindowMinutes:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 60
    Description: Minutos antes/después de la hora programada para monitorizar el tren

  AlertEmailAddress:
    Type: String
    Default: "albertobp@gmail.com"
    Description: Email para alertas de retrasos (opcional)

  DelayAlertThresholdMinutes:
    Type: Number
    Default: 15
    MinValue: 1
    Description: >
      Umbral de retraso (minutos) a partir del cual, al marcarse un tren
      como entregado, se publica un tuit automático.

  SignificantDelayThresholdMinutes:
    Type: Number
    Default: 15
    MinValue: 1
    MaxValue: 60   # por encima de 60 el tramo "significativo" quedaría vacío/contradictorio con "grave"
    Description: >
      Umbral de retraso (minutos) a partir del cual un viaje cuenta como
      "retraso significativo" en las métricas precalculadas (por tren,
      semanales, mensuales). Deliberadamente independiente de
      DelayAlertThresholdMinutes (ese controla los tuits automáticos, un
      concern distinto que hoy comparte el mismo valor por coincidencia)
      — ver lambdas/train_tracker/metrics_writer.py.

  FlagshipMadridTrainCode:
    Type: String
    Default: "04154"
    Description: >
      cod_comercial del primer tren laborable hacia Madrid (el "tren
      madrugador" de la reivindicación de la asociación). Este tren publica
      alerta de tuit siempre, tenga o no retraso — ver
      train_tracker/handler.py:_maybe_publish_delay_alert.

  ClaudeModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-4-6
    Description: >
      ID de modelo Bedrock (con prefijo de inference profile: este modelo
      solo se sirve vía cross-region inference, no on-demand) usado por
      tweet_notifier para redactar el texto del tuit y los hashtags.

  NegativeDelayAnomalyThresholdMinutes:
    Type: Number
    Default: -10
    MaxValue: 0
    Description: >
      Umbral (minutos) por debajo del cual un ultRetraso reportado por Renfe
      en flotaLD.json se considera anómalo (posible bug del servicio, no un
      adelanto real) y se recalcula a partir de la hora actual en vez de
      usarse tal cual. Dispara además un email a AlertEmailAddress.

  GtfsRtEnrichmentEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Activa el enriquecimiento aditivo con el feed GTFS-RT oficial de Renfe
      (trip_updates_LD.json). Aditivo y no bloqueante: solo añade
      minutos_retraso_gtfsrt/hora_llegada_gtfsrt/hora_paso_zamora_gtfsrt
      junto a los campos ya existentes, nunca los sustituye. Por defecto
      desactivado porque la regla de emparejamiento tripId→cod_comercial es
      todavía provisional (ver CLAUDE.md) — actívese a propósito cuando se
      quiera empezar la ventana de comparación.

  GlueDatabaseName:
    Type: String
    Default: zamora_trains_db
    Description: Nombre de la base de datos en AWS Glue Data Catalog

  DomainName:
    Type: String
    Default: ""
    Description: >
      Dominio propio del frontend (p.ej. zamorave.com). El registro del
      dominio en sí NO es automatizable con SAM/CloudFormation — ver
      infrastructure/DOMAIN_SETUP.md. Dejar vacío para desplegar sin
      dominio propio (el frontend queda accesible solo por el dominio
      *.cloudfront.net de FrontendDistribution).

  HostedZoneId:
    Type: String
    Default: ""
    Description: >
      Id de la Hosted Zone pública de Route53 para DomainName. Route53 la
      crea automáticamente al registrar el dominio; obtenerla con
      `aws route53 list-hosted-zones-by-name --dns-name <dominio>` — ver
      infrastructure/DOMAIN_SETUP.md. Requerido si DomainName no está vacío.

  FrontendCertificateArn:
    Type: String
    Default: ""
    Description: >
      ARN del certificado ACM para DomainName. Debe existir en us-east-1
      (requisito de CloudFront, sea cual sea AwsRegion) — desplegado por
      separado con infrastructure/certificate-us-east-1.yaml, ya que
      CloudFormation no admite recursos de dos regiones en un mismo stack.
      Requerido si DomainName no está vacío.


# ══════════════════════════════════════════════════════════════════════════════
# CONDICIONES
# ══════════════════════════════════════════════════════════════════════════════
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmailAddress, ""]]
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]


# ══════════════════════════════════════════════════════════════════════════════
# GLOBALS SAM
# ══════════════════════════════════════════════════════════════════════════════
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Architectures: [arm64]          # Graviton2: ~20% más barato que x86_64
    Environment:
      Variables:
        ENVIRONMENT:          !Ref Environment
        ZAMORA_STATION_CODE:  !Ref ZamoraStationCode
        CHAMARTIN_STATION_CODE: !Ref ChamartinStationCode
        DATALAKE_S3_BUCKET:   !Ref DatalakeBucket
        DYNAMODB_STATE_TABLE: !Ref TrainStateTable
        DYNAMODB_METRICS_TABLE: !Ref TrainMetricsTable
        SIGNIFICANT_DELAY_THRESHOLD_MINUTES: !Ref SignificantDelayThresholdMinutes
        TRENDS_S3_KEY:        "trends/latest_hashtags.json"
        LOG_LEVEL:            INFO


# ══════════════════════════════════════════════════════════════════════════════
# RECURSOS
# ══════════════════════════════════════════════════════════════════════════════
Resources:

  # ── S3: Data Lake ──────────────────────────────────────────────────────────
  DatalakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "zamora-trains-datalake-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER_IR
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true   # Para poder reaccionar a nuevos objetos si hace falta

  # ── DynamoDB: Estado transitorio de trenes ─────────────────────────────────
  TrainStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "zamora-train-state-${Environment}"
      BillingMode: PAY_PER_REQUEST   # On-demand: tráfico muy bajo (< 300 escrituras/día)
      TableClass: STANDARD           # DynamoDB Standard (no DynamoDB Standard-IA)
      AttributeDefinitions:
        - AttributeName: pk          # "{cod_comercial}#{fecha}"  e.g. "04154#2024-11-15"
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true                # Los registros expiran automáticamente tras 24h
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ── DynamoDB: Métricas de puntualidad precalculadas ────────────────────────
  # Tabla permanente (sin TTL), a diferencia de TrainStateTable: aquí vive el
  # histórico agregado por tren (TRAIN#{cod_comercial}), semana ISO
  # (WEEK#{iso_year}-W{iso_week}) y mes natural (MONTH#{year}-{month}),
  # actualizado una vez al día por DailyDumpFunction (ver
  # lambdas/train_tracker/metrics_writer.py) y servido de solo lectura por
  # GetTrainMetricsFunction/GetWeekMetricsFunction/GetMonthMetricsFunction.
  TrainMetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "zamora-train-metrics-${Environment}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: pk          # "TRAIN#{cod}" | "WEEK#{iso_year}-W{iso_week}" | "MONTH#{year}-{month}"
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ── Lambda: Train Tracker ──────────────────────────────────────────────────
  TrainTrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-train-tracker-${Environment}"
      CodeUri: ../lambdas/train_tracker/
      Handler: handler.lambda_handler
      Description: >
        Ejecutada cada 5 minutos. Consulta flotaLD.json de Renfe y actualiza
        el estado de cada tren en DynamoDB. No escribe en S3 directamente:
        el volcado a S3 lo hace DailyDumpFunction una vez al día.
      Environment:
        Variables:
          DELAY_ALERT_SNS_TOPIC_ARN: !Ref DelayTweetTopic
          DELAY_ALERT_THRESHOLD_MINUTES: !Ref DelayAlertThresholdMinutes
          FLAGSHIP_MADRID_TRAIN_CODE: !Ref FlagshipMadridTrainCode
          GTFS_RT_ENRICHMENT_ENABLED: !Ref GtfsRtEnrichmentEnabled
          DATA_QUALITY_ALERT_SNS_TOPIC_ARN: !If [HasAlertEmail, !Ref AlertTopic, ""]
          NEGATIVE_DELAY_ANOMALY_THRESHOLD_MINUTES: !Ref NegativeDelayAnomalyThresholdMinutes
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrainStateTable
        - CloudWatchPutMetricPolicy: {}
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt DelayTweetTopic.TopicName
        - !If
          - HasAlertEmail
          - SNSPublishMessagePolicy:
              TopicName: !GetAtt AlertTopic.TopicName
          - !Ref AWS::NoValue
      Events:
        # Cron no admite un patrón de minutos distinto por hora en una sola
        # expresión, así que el tramo 07:00–23:30 se cubre con dos schedules:
        # uno para las horas completas y otro para el tramo parcial final.
        # ScheduleExpressionTimezone=Europe/Madrid gestiona el cambio CET/CEST
        # automáticamente (no hace falta calcular el offset a mano).
        ScheduleEvery5MinMorningToNight:
          Type: ScheduleV2
          Properties:
            Name: !Sub "zamora-train-tracker-poll-morning-${Environment}"
            ScheduleExpression: "cron(0/5 7-22 * * ? *)"
            ScheduleExpressionTimezone: "Europe/Madrid"
            FlexibleTimeWindow:
              Mode: "OFF"            # Sin flexibilidad: queremos exactitud temporal
            Description: "Polling cada 5 minutos entre las 07:00 y las 22:55 (hora de Madrid)"
        ScheduleEvery5MinLastHour:
          Type: ScheduleV2
          Properties:
            Name: !Sub "zamora-train-tracker-poll-lasthour-${Environment}"
            ScheduleExpression: "cron(0,5,10,15,20,25,30,35,40,45,50,55,59 23 * * ? *)"
            ScheduleExpressionTimezone: "Europe/Madrid"
            FlexibleTimeWindow:
              Mode: "OFF"
            Description: "Polling cada 5 minutos entre las 23:00 y las 23:30 (hora de Madrid)"
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  # ── Lambda: Volcado diario a S3 ──────────────────────────────────────────────
  DailyDumpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-daily-dump-${Environment}"
      CodeUri: ../lambdas/train_tracker/
      Handler: handler.daily_dump_handler
      Description: >
        Ejecutada una vez al día a las 00:15 (hora de Madrid). Vuelca a S3
        los trenes del día anterior y actualiza (best-effort) las métricas
        precalculadas en TrainMetricsTable.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrainStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TrainMetricsTable
        - S3WritePolicy:
            BucketName: !Ref DatalakeBucket
      Events:
        DailyDumpSchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub "zamora-daily-dump-${Environment}"
            ScheduleExpression: "cron(15 0 * * ? *)"
            ScheduleExpressionTimezone: "Europe/Madrid"
            FlexibleTimeWindow:
              Mode: "OFF"
            Description: "Volcado diario a S3, 00:15 hora de Madrid (el TTL de DynamoDB expira a las 00:30)"
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  # ── Tuit automático de retrasos ─────────────────────────────────────────────
  # SNS desacopla la publicación del tuit del ciclo de polling: un fallo o
  # lentitud de la API de X no debe bloquear ni retrasar TrainTrackerFunction.
  DelayTweetTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "zamora-trains-delay-tweet-${Environment}"

  # Placeholder: las credenciales OAuth1.0a reales (consumer_key,
  # consumer_secret, access_token, access_token_secret) de la X Developer
  # App se rellenan a mano tras el despliegue (consola/CLI) — nunca en el
  # template.
  XApiCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "zamora-trains-x-api-credentials-${Environment}"
      Description: "Credenciales OAuth1.0a de la X Developer App (rellenar a mano tras el despliegue)"
      SecretString: >-
        {"consumer_key":"","consumer_secret":"","access_token":"","access_token_secret":""}

  # Placeholder: la API key real de xfetch.io (proveedor externo de datos
  # públicos de X, no la API oficial de X ni de Anthropic — ver
  # lambdas/trend_fetcher/xfetch_client.py) se rellena a mano tras el
  # despliegue, igual que XApiCredentialsSecret.
  XfetchApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "zamora-trains-xfetch-api-key-${Environment}"
      Description: "API key de xfetch.io para tendencias de X (rellenar a mano tras el despliegue)"
      SecretString: "CHANGEME"

  TweetNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-tweet-notifier-${Environment}"
      CodeUri: ../lambdas/tweet_notifier/
      Handler: handler.lambda_handler
      Description: >
        Disparada por DelayTweetTopic cuando un tren se marca entregado con
        más de DelayAlertThresholdMinutes minutos de retraso (o es el tren
        madrugador). Redacta el tuit con Claude (Bedrock) más tendencias de
        X leídas de S3; por ahora solo lo loguea.
      Environment:
        Variables:
          X_API_CREDENTIALS_SECRET_ARN: !Ref XApiCredentialsSecret
          CLAUDE_MODEL_ID: !Ref ClaudeModelId
          DELAY_ALERT_THRESHOLD_MINUTES: !Ref DelayAlertThresholdMinutes
          TRENDS_ENABLED: "true"
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DatalakeBucket
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref XApiCredentialsSecret
            # Modelo de cross-region inference: hace falta permiso tanto
            # sobre el inference profile como sobre el foundation model al
            # que enruta (ver infrastructure notes / AWS docs de Bedrock).
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AwsRegion}:${AWS::AccountId}:inference-profile/${ClaudeModelId}"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6"
            # Los modelos de Anthropic en Bedrock están sujetos a suscripción
            # de AWS Marketplace por debajo: sin estos dos permisos, la
            # comprobación de entitlement de InvokeModel puede fallar aunque
            # el rol ya tenga bedrock:InvokeModel. No admite scoping por
            # recurso — requieren Resource: "*".
            - Effect: Allow
              Action:
                - aws-marketplace:ViewSubscriptions
                - aws-marketplace:Subscribe
              Resource: "*"
      Events:
        DelayTweetSubscription:
          Type: SNS
          Properties:
            Topic: !Ref DelayTweetTopic
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  # ── Lambda: consulta de tendencias de X (xfetch.io), 2 veces al día ────────
  # Desacoplada de TweetNotifierFunction para no golpear xfetch.io una vez
  # por cada tuit redactado: consulta 2 veces al día y guarda el resultado en
  # S3 (trends/latest_hashtags.json), que TweetNotifierFunction lee vía
  # trends_reader.py. Reduce el consumo de créditos de xfetch.io sin perder
  # frescura relevante para el contenido de los tuits.
  TrendFetcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-trend-fetcher-${Environment}"
      CodeUri: ../lambdas/trend_fetcher/
      Handler: handler.lambda_handler
      Description: >
        Ejecutada 2 veces al día (08:00 y 19:00, hora de Madrid). Consulta
        las tendencias actuales de X en España vía xfetch.io y las guarda en
        S3 para que TweetNotifierFunction las lea sin volver a consultar
        xfetch.io en cada tuit.
      Environment:
        Variables:
          XFETCH_API_KEY_SECRET_ARN: !Ref XfetchApiKeySecret
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DatalakeBucket
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref XfetchApiKeySecret
      Events:
        TrendFetchSchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub "zamora-trend-fetcher-${Environment}"
            ScheduleExpression: "cron(0 8,19 * * ? *)"
            ScheduleExpressionTimezone: "Europe/Madrid"
            FlexibleTimeWindow:
              Mode: "OFF"
            Description: "Consulta de tendencias de X, 08:00 y 19:00 hora de Madrid"
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  # ── Lambda: métricas de retraso para CloudWatch ────────────────────────────
  DelayMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-delay-metrics-${Environment}"
      CodeUri: ../lambdas/delay_metrics/
      Handler: handler.lambda_handler
      Description: >
        Disparada por S3 Event Notification cuando se escribe un nuevo objeto
        en el Data Lake. Publica métricas de retraso en CloudWatch.
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DatalakeBucket
        - CloudWatchPutMetricPolicy: {}
      Events:
        S3NewObject:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["aws.s3"]
              detail-type: ["Object Created"]
              detail:
                bucket:
                  name: [!Ref DatalakeBucket]
                object:
                  key:
                    - prefix: "zamora-trains/"

  # ── API HTTP: lectura de trenes ────────────────────────────────────────────
  # HttpApi explícito (en vez de un API implícito por función) para que
  # futuras rutas de solo lectura (métricas Athena, sugerencias de corrección)
  # puedan colgarse del mismo API Gateway sin volver a aprovisionar nada.
  TrainsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
        AllowHeaders:
          - "*"

  GetTodayTrainsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-get-today-trains-${Environment}"
      CodeUri: ../lambdas/api/
      Handler: handler.get_today_handler
      Description: >
        API de solo lectura: devuelve los trenes de hoy desde DynamoDB
        (datos en vivo/parciales del día en curso).
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrainStateTable
      Events:
        GetTodayApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrainsApi
            Path: /trains/today
            Method: GET
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  GetDayTrainsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-get-day-trains-${Environment}"
      CodeUri: ../lambdas/api/
      Handler: handler.get_day_handler
      Description: >
        API de solo lectura: devuelve los trenes de un día pasado desde el
        fichero JSONL del Data Lake en S3. Devuelve 404 si ese día aún no se
        ha volcado.
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DatalakeBucket
      Events:
        GetDayApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrainsApi
            Path: /trains/{date}
            Method: GET
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  GetFlotaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-get-flota-${Environment}"
      CodeUri: ../lambdas/api/
      Handler: handler.get_flota_handler
      Description: >
        Proxy de solo lectura de flotaLD.json de Renfe (sin cabeceras CORS):
        reenvía la respuesta tal cual, añadiendo Access-Control-Allow-Origin.
      Events:
        GetFlotaApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrainsApi
            Path: /renfe/flota
            Method: GET
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  # ── API HTTP: métricas de puntualidad precalculadas ────────────────────────
  # Solo lectura sobre TrainMetricsTable (poblada por DailyDumpFunction, ver
  # lambdas/train_tracker/metrics_writer.py): porcentajes/ranking derivados en
  # el propio handler a partir de contadores ya agregados, nunca recalculados
  # desde cero en cada petición.
  GetTrainMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-get-train-metrics-${Environment}"
      CodeUri: ../lambdas/api/
      Handler: handler.get_train_metrics_handler
      Description: >
        API de solo lectura: métricas de puntualidad por tren (histórico
        completo), incluyendo ranking de probabilidad de retraso
        significativo respecto al resto de trenes.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrainMetricsTable
      Events:
        GetTrainMetricsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrainsApi
            Path: /metrics/trains
            Method: GET
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  GetWeekMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-get-week-metrics-${Environment}"
      CodeUri: ../lambdas/api/
      Handler: handler.get_week_metrics_handler
      Description: >
        API de solo lectura: métricas de puntualidad por semana ISO
        (lunes-domingo), incluyendo la semana en curso (parcial).
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrainMetricsTable
      Events:
        GetWeekMetricsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrainsApi
            Path: /metrics/weeks
            Method: GET
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  GetMonthMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-get-month-metrics-${Environment}"
      CodeUri: ../lambdas/api/
      Handler: handler.get_month_metrics_handler
      Description: >
        API de solo lectura: métricas de puntualidad por mes natural,
        incluyendo el mes en curso (parcial).
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrainMetricsTable
      Events:
        GetMonthMetricsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrainsApi
            Path: /metrics/months
            Method: GET
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  GetGlobalMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-get-global-metrics-${Environment}"
      CodeUri: ../lambdas/api/
      Handler: handler.get_global_metrics_handler
      Description: >
        API de solo lectura: métricas de puntualidad de todo el histórico
        (día de la semana, franja horaria y tren con más riesgo de retraso
        significativo). Devuelve 404 si aún no se ha agregado ningún día.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrainMetricsTable
      Events:
        GetGlobalMetricsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrainsApi
            Path: /metrics/global
            Method: GET
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  GetTrainScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-get-train-schedule-${Environment}"
      CodeUri: ../lambdas/api/
      Handler: handler.get_train_schedule_handler
      Description: >
        API de solo lectura: días de la semana (lunes-domingo) que circula
        cada tren, a partir del horario compilado (train_schedules.json).
        No accede a DynamoDB.
      Events:
        GetTrainScheduleApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrainsApi
            Path: /trains/schedule
            Method: GET
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  # ── Frontend: hosting estático + CDN ──────────────────────────────────────────
  # CloudFront (con Origin Access Control) delante de un bucket S3 privado.
  # Sustituye el S3 website hosting público que había antes: hacía falta un
  # CDN de todos modos para servir DomainName con HTTPS (S3 website hosting
  # no admite certificados propios) y de paso resuelve el fallback de rutas
  # de la SPA (ver SpaFallbackFunction) y expone el API bajo /api en el
  # mismo dominio, sin /prod en el path (ver ApiPathRewriteFunction).
  # Contenido sin datos sensibles (retrasos de trenes), pero ya no hace
  # falta exponer el bucket S3 directamente: solo CloudFront puede leerlo
  # (OAC).
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "zamora-trains-frontend-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOriginAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "zamora-trains-frontend-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Reescribe /api/algo -> /algo antes de reenviar a API Gateway. El origen
  # ya añade el stage (OriginPath: /{Environment}) delante de lo que llega,
  # así que sin esto la petición acabaría en /{Environment}/api/algo en vez
  # de /{Environment}/algo. Resultado: el path público es /api/... sin
  # /prod, aunque el HttpApi siga usando un stage internamente.
  ApiPathRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "zamora-trains-api-path-rewrite-${Environment}"
      AutoPublish: true
      FunctionConfig:
        Comment: "Quita el prefijo /api antes de reenviar a API Gateway"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            request.uri = request.uri.replace(/^\/api/, '') || '/';
            return request;
        }

  # Fallback de rutas de la SPA. Deliberadamente NO se usa
  # CustomErrorResponses (403/404 -> index.html): eso es a nivel de
  # distribución completa, no por origen, así que también interceptaría
  # los 404 reales que devuelve la API (p.ej. GetDayFunction cuando un día
  # aún no tiene datos — ver lambdas/api/handler.py) y los sustituiría por
  # index.html con 200. En su lugar, se reescribe en el propio origen S3
  # cualquier ruta sin extensión (las rutas de cliente de la SPA) a
  # /index.html antes de llegar a S3; los ficheros estáticos reales
  # (*.js, *.css, favicon.ico, ...) pasan sin tocar.
  SpaFallbackFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "zamora-trains-spa-fallback-${Environment}"
      AutoPublish: true
      FunctionConfig:
        Comment: "Sirve index.html para rutas de cliente sin extensión de fichero"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var uri = request.uri;
            var lastSegment = uri.split('/').pop();
            if (!lastSegment.includes('.')) {
                request.uri = '/index.html';
            }
            return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Zamora Train Observability — frontend (${Environment})"
        DefaultRootObject: index.html
        Aliases: !If
          - HasCustomDomain
          - - !Ref DomainName
            - !Sub "www.${DomainName}"
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref FrontendCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""   # legado: la autorización real la da OriginAccessControlId
          - Id: ApiGatewayOrigin
            DomainName: !Sub "${TrainsApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${Environment}"   # sustituye al /prod que el visitante ya no ve
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              HTTPPort: 80
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # managed policy: CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaFallbackFunction.FunctionARN
        CacheBehaviors:
          # API bajo /api en el mismo dominio: mismo origin que la web, sin
          # CORS (same-origin) y sin /prod visible en el path público.
          - PathPattern: "/api/*"
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # managed policy: CachingDisabled (datos dinámicos, refrescan cada 5 min)
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # managed policy: AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiPathRewriteFunction.FunctionARN
      Tags:
        - Key: Project
          Value: ZamoraTrainObservability
        - Key: Environment
          Value: !Ref Environment

  # Alias A/AAAA hacia CloudFront. Z2FDTNDATAQYW2 es la "hosted zone" fija
  # que AWS asigna a todas las distribuciones CloudFront como target de
  # alias (constante pública de AWS, no depende de esta distribución ni de
  # la región del stack).
  FrontendDnsRecordApex:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  FrontendDnsRecordApexV6:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  FrontendDnsRecordWww:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  FrontendDnsRecordWwwV6:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ── CloudWatch: Alarma de retrasos grandes ──────────────────────────────────
  HighDelayAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: !Sub "ZamoraTrain-HighDelay-${Environment}"
      AlarmDescription: "Tren con retraso > 30 minutos en Zamora"
      Namespace: ZamoraTrains
      MetricName: TrainDelayMinutes
      Statistic: Maximum
      Period: 300                    # 5 minutos
      EvaluationPeriods: 1
      Threshold: 30
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # Topic de alertas por email de propósito general: usado por HighDelayAlarm
  # (vía CloudWatch Alarm) y también publicado directamente por
  # TrainTrackerFunction (ver DATA_QUALITY_ALERT_SNS_TOPIC_ARN /
  # _publish_negative_delay_alert en handler.py) cuando Renfe reporta un
  # ultRetraso anómalo (< NegativeDelayAnomalyThresholdMinutes) en
  # flotaLD.json, para poder revisar manualmente la corrección automática.
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub "zamora-trains-alerts-${Environment}"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmailAddress

  # ── AWS Glue: Data Catalog ─────────────────────────────────────────────────
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: "Data Lake de puntualidad de trenes en Zamora"

  # Tabla definida a mano (sin Crawler): las columnas deben coincidir
  # exactamente con las claves del JSON que escribe daily_dump_handler() en
  # handler.py. Las particiones (year/month/day) se resuelven mediante
  # Partition Projection, así que tampoco hace falta ALTER TABLE ADD PARTITION
  # ni ejecutar nada tras cada despliegue para que Athena vea los datos nuevos.
  TrainsTable:
    Type: AWS::Glue::Table
    DependsOn: GlueDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabaseName
      TableInput:
        Name: zamora_trains
        Description: "Eventos de paso/llegada de trenes por Zamora (Madrid/Galicia)"
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          "projection.enabled": "true"
          "projection.year.type": "integer"
          "projection.year.range": "2024,2035"
          "projection.month.type": "integer"
          "projection.month.range": "1,12"
          "projection.month.digits": "2"
          "projection.day.type": "integer"
          "projection.day.range": "1,31"
          "projection.day.digits": "2"
          "storage.location.template": !Sub "s3://${DatalakeBucket}/zamora-trains/year=${!year}/month=${!month}/day=${!day}/"
        PartitionKeys:
          - Name: year
            Type: string
          - Name: month
            Type: string
          - Name: day
            Type: string
        StorageDescriptor:
          Location: !Sub "s3://${DatalakeBucket}/zamora-trains/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              "ignore.malformed.json": "true"
          Columns:
            # Debe reflejar exactamente el dict `record` que construye
            # daily_dump_handler() en lambdas/train_tracker/handler.py.
            - Name: event_id
              Type: string
            - Name: cod_comercial
              Type: string
            - Name: sentido
              Type: string
            - Name: tipo_dia
              Type: string
            - Name: dia_semana
              Type: string
            - Name: hora_programada
              Type: string
            - Name: hora_llegada_corregida
              Type: string
            - Name: hora_paso_zamora
              Type: string
            - Name: minutos_retraso
              Type: int
            - Name: minutos_retraso_gtfsrt
              Type: int
            - Name: hora_llegada_gtfsrt
              Type: string
            - Name: hora_paso_zamora_gtfsrt
              Type: string
            - Name: cancelado
              Type: boolean

  # ── Athena: Workgroup ─────────────────────────────────────────────────────
  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "zamora-trains-${Environment}"
      Description: "Queries sobre el Data Lake de trenes Zamora"
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://${DatalakeBucket}/athena-results/"
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 1073741824   # 1 GB máximo por query

  # ── CloudWatch Dashboard ──────────────────────────────────────────────────
  TrainDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "ZamoraTrains-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "title": "Retraso medio diario (minutos)",
                "metrics": [
                  ["ZamoraTrains", "TrainDelayMinutes", "Sentido", "Madrid"],
                  ["ZamoraTrains", "TrainDelayMinutes", "Sentido", "Galicia"]
                ],
                "stat": "Average",
                "period": 86400,
                "view": "timeSeries",
                "region": "${AwsRegion}"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Trenes con retraso > 0 (por día)",
                "metrics": [
                  ["ZamoraTrains", "TrainsWithDelay"]
                ],
                "stat": "Sum",
                "period": 86400,
                "view": "timeSeries",
                "region": "${AwsRegion}"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Ejecuciones Lambda",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "zamora-train-tracker-${Environment}"],
                  ["AWS/Lambda", "Errors",      "FunctionName", "zamora-train-tracker-${Environment}"]
                ],
                "stat": "Sum",
                "period": 300,
                "region": "${AwsRegion}"
              }
            }
          ]
        }


# ══════════════════════════════════════════════════════════════════════════════
# OUTPUTS
# ══════════════════════════════════════════════════════════════════════════════
Outputs:
  DatalakeBucketName:
    Description: "Nombre del bucket S3 del Data Lake"
    Value: !Ref DatalakeBucket
    Export:
      Name: !Sub "${AWS::StackName}-DatalakeBucket"

  DynamoDBTableName:
    Description: "Tabla DynamoDB de estado de trenes"
    Value: !Ref TrainStateTable

  TrainTrackerFunctionArn:
    Description: "ARN de la Lambda principal"
    Value: !GetAtt TrainTrackerFunction.Arn

  AthenaWorkgroupName:
    Description: "Workgroup Athena para queries"
    Value: !Ref AthenaWorkgroup

  GlueDatabaseName:
    Description: "Base de datos Glue Data Catalog"
    Value: !Ref GlueDatabase

  DashboardURL:
    Description: "URL del CloudWatch Dashboard"
    Value: !Sub "https://${AwsRegion}.console.aws.amazon.com/cloudwatch/home#dashboards:name=ZamoraTrains-${Environment}"

  XApiCredentialsSecretName:
    Description: >
      Nombre del secret en Secrets Manager donde rellenar a mano las
      credenciales OAuth1.0a de la X Developer App tras el despliegue.
    Value: !Ref XApiCredentialsSecret

  TrainsApiBaseUrl:
    Description: "URL directa del API HTTP de trenes (endpoint execute-api, incluye el stage del entorno)"
    Value: !Sub "https://${TrainsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  ApiBaseUrl:
    Description: >-
      URL base recomendada para el frontend (usar como VITE_API_BASE_URL): vía
      CloudFront bajo /api en el mismo dominio que sirve la web (el propio si
      hay DomainName, si no el *.cloudfront.net), sin el stage en el path.
    Value: !If
      - HasCustomDomain
      - !Sub "https://${DomainName}/api"
      - !Sub "https://${FrontendDistribution.DomainName}/api"

  FrontendBucketName:
    Description: "Bucket S3 del frontend estático (privado, solo accesible vía CloudFront)"
    Value: !Ref FrontendBucket

  FrontendDistributionId:
    Description: "Id de la distribución CloudFront (usar para invalidar caché tras cada deploy del frontend)"
    Value: !Ref FrontendDistribution

  FrontendDistributionDomainName:
    Description: "Dominio *.cloudfront.net del frontend — usar si DomainName está vacío"
    Value: !GetAtt FrontendDistribution.DomainName

  FrontendCustomDomainUrl:
    Condition: HasCustomDomain
    Description: "URL pública del frontend en el dominio propio"
    Value: !Sub "https://${DomainName}"
