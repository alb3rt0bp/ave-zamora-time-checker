AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Zamora Train Observability
  Data Lake de puntualidad de trenes Alvia/Intercity en la estación de Zamora.
  Arquitectura: EventBridge Scheduler → Lambda (cada 5 min) → S3 Data Lake + DynamoDB.

# ══════════════════════════════════════════════════════════════════════════════
# PARÁMETROS
# ══════════════════════════════════════════════════════════════════════════════
Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Entorno de despliegue

  AwsRegion:
    Type: String
    Default: eu-south-2
    Description: >
      Región AWS del despliegue. Debe coincidir con la región donde se
      despliega el stack (usada en los widgets del Dashboard y la URL).

  ZamoraStationCode:
    Type: String
    Default: "30200"
    Description: >
      Código de estación Zamora en el sistema Renfe.
      Verificar contra codEstAnt en flotaLD.json.

  ChamartinStationCode:
    Type: String
    Default: "17000"
    Description: >
      Código de estación Madrid Chamartín en el sistema Renfe.
      Usado para detectar la llegada de los trenes con sentido Madrid.
      Verificar contra codEstAnt en flotaLD.json.

  PollingWindowMinutes:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 60
    Description: Minutos antes/después de la hora programada para monitorizar el tren

  AlertEmailAddress:
    Type: String
    Default: ""
    Description: Email para alertas de retrasos (opcional)

  DelayAlertThresholdMinutes:
    Type: Number
    Default: 15
    MinValue: 1
    Description: >
      Umbral de retraso (minutos) a partir del cual, al marcarse un tren
      como entregado, se publica un tuit automático.

  GlueDatabaseName:
    Type: String
    Default: zamora_trains_db
    Description: Nombre de la base de datos en AWS Glue Data Catalog


# ══════════════════════════════════════════════════════════════════════════════
# CONDICIONES
# ══════════════════════════════════════════════════════════════════════════════
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmailAddress, ""]]


# ══════════════════════════════════════════════════════════════════════════════
# GLOBALS SAM
# ══════════════════════════════════════════════════════════════════════════════
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Architectures: [arm64]          # Graviton2: ~20% más barato que x86_64
    Environment:
      Variables:
        ENVIRONMENT:          !Ref Environment
        ZAMORA_STATION_CODE:  !Ref ZamoraStationCode
        CHAMARTIN_STATION_CODE: !Ref ChamartinStationCode
        DATALAKE_S3_BUCKET:   !Ref DatalakeBucket
        DYNAMODB_STATE_TABLE: !Ref TrainStateTable
        LOG_LEVEL:            INFO


# ══════════════════════════════════════════════════════════════════════════════
# RECURSOS
# ══════════════════════════════════════════════════════════════════════════════
Resources:

  # ── S3: Data Lake ──────────────────────────────────────────────────────────
  DatalakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "zamora-trains-datalake-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER_IR
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true   # Para poder reaccionar a nuevos objetos si hace falta

  # ── DynamoDB: Estado transitorio de trenes ─────────────────────────────────
  TrainStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "zamora-train-state-${Environment}"
      BillingMode: PAY_PER_REQUEST   # On-demand: tráfico muy bajo (< 300 escrituras/día)
      TableClass: STANDARD           # DynamoDB Standard (no DynamoDB Standard-IA)
      AttributeDefinitions:
        - AttributeName: pk          # "{cod_comercial}#{fecha}"  e.g. "04154#2024-11-15"
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true                # Los registros expiran automáticamente tras 24h
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ── Lambda: Train Tracker ──────────────────────────────────────────────────
  TrainTrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-train-tracker-${Environment}"
      CodeUri: ../lambdas/train_tracker/
      Handler: handler.lambda_handler
      Description: >
        Ejecutada cada 5 minutos. Consulta flotaLD.json de Renfe y actualiza
        el estado de cada tren en DynamoDB. No escribe en S3 directamente:
        el volcado a S3 lo hace DailyDumpFunction una vez al día.
      Environment:
        Variables:
          DELAY_ALERT_SNS_TOPIC_ARN: !Ref DelayTweetTopic
          DELAY_ALERT_THRESHOLD_MINUTES: !Ref DelayAlertThresholdMinutes
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrainStateTable
        - CloudWatchPutMetricPolicy: {}
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt DelayTweetTopic.TopicName
      Events:
        # Cron no admite un patrón de minutos distinto por hora en una sola
        # expresión, así que el tramo 07:00–23:30 se cubre con dos schedules:
        # uno para las horas completas y otro para el tramo parcial final.
        # ScheduleExpressionTimezone=Europe/Madrid gestiona el cambio CET/CEST
        # automáticamente (no hace falta calcular el offset a mano).
        ScheduleEvery5MinMorningToNight:
          Type: ScheduleV2
          Properties:
            Name: !Sub "zamora-train-tracker-poll-morning-${Environment}"
            ScheduleExpression: "cron(0/5 7-22 * * ? *)"
            ScheduleExpressionTimezone: "Europe/Madrid"
            FlexibleTimeWindow:
              Mode: "OFF"            # Sin flexibilidad: queremos exactitud temporal
            Description: "Polling cada 5 minutos entre las 07:00 y las 22:55 (hora de Madrid)"
        ScheduleEvery5MinLastHour:
          Type: ScheduleV2
          Properties:
            Name: !Sub "zamora-train-tracker-poll-lasthour-${Environment}"
            ScheduleExpression: "cron(0,5,10,15,20,25,30,35,40,45,50,55,59 23 * * ? *)"
            ScheduleExpressionTimezone: "Europe/Madrid"
            FlexibleTimeWindow:
              Mode: "OFF"
            Description: "Polling cada 5 minutos entre las 23:00 y las 23:30 (hora de Madrid)"
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  # ── Lambda: Volcado diario a S3 ──────────────────────────────────────────────
  DailyDumpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-daily-dump-${Environment}"
      CodeUri: ../lambdas/train_tracker/
      Handler: handler.daily_dump_handler
      Description: >
        Ejecutada una vez al día a las 00:15 (hora de Madrid). Lee de
        DynamoDB los trenes del día anterior marcados como entregados y
        escribe un único fichero JSONL en el Data Lake S3.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrainStateTable
        - S3WritePolicy:
            BucketName: !Ref DatalakeBucket
      Events:
        DailyDumpSchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub "zamora-daily-dump-${Environment}"
            ScheduleExpression: "cron(15 0 * * ? *)"
            ScheduleExpressionTimezone: "Europe/Madrid"
            FlexibleTimeWindow:
              Mode: "OFF"
            Description: "Volcado diario a S3, 00:15 hora de Madrid (el TTL de DynamoDB expira a las 00:30)"
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  # ── Tuit automático de retrasos ─────────────────────────────────────────────
  # SNS desacopla la publicación del tuit del ciclo de polling: un fallo o
  # lentitud de la API de X no debe bloquear ni retrasar TrainTrackerFunction.
  DelayTweetTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "zamora-trains-delay-tweet-${Environment}"

  # Placeholder: las credenciales OAuth1.0a reales (consumer_key,
  # consumer_secret, access_token, access_token_secret) de la X Developer
  # App se rellenan a mano tras el despliegue (consola/CLI) — nunca en el
  # template.
  XApiCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "zamora-trains-x-api-credentials-${Environment}"
      Description: "Credenciales OAuth1.0a de la X Developer App (rellenar a mano tras el despliegue)"
      SecretString: >-
        {"consumer_key":"","consumer_secret":"","access_token":"","access_token_secret":""}

  TweetNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-tweet-notifier-${Environment}"
      CodeUri: ../lambdas/tweet_notifier/
      Handler: handler.lambda_handler
      Description: >
        Disparada por DelayTweetTopic cuando un tren se marca entregado con
        más de DelayAlertThresholdMinutes minutos de retraso. Publica un
        tuit en la cuenta de la asociación vía la API de X.
      Environment:
        Variables:
          X_API_CREDENTIALS_SECRET_ARN: !Ref XApiCredentialsSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref XApiCredentialsSecret
      Events:
        DelayTweetSubscription:
          Type: SNS
          Properties:
            Topic: !Ref DelayTweetTopic
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  # ── Lambda: métricas de retraso para CloudWatch ────────────────────────────
  DelayMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-delay-metrics-${Environment}"
      CodeUri: ../lambdas/delay_metrics/
      Handler: handler.lambda_handler
      Description: >
        Disparada por S3 Event Notification cuando se escribe un nuevo objeto
        en el Data Lake. Publica métricas de retraso en CloudWatch.
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DatalakeBucket
        - CloudWatchPutMetricPolicy: {}
      Events:
        S3NewObject:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["aws.s3"]
              detail-type: ["Object Created"]
              detail:
                bucket:
                  name: [!Ref DatalakeBucket]
                object:
                  key:
                    - prefix: "zamora-trains/"

  # ── API HTTP: lectura de trenes ────────────────────────────────────────────
  # HttpApi explícito (en vez de un API implícito por función) para que
  # futuras rutas de solo lectura (métricas Athena, sugerencias de corrección)
  # puedan colgarse del mismo API Gateway sin volver a aprovisionar nada.
  TrainsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
        AllowHeaders:
          - "*"

  GetTodayTrainsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-get-today-trains-${Environment}"
      CodeUri: ../lambdas/api/
      Handler: handler.get_today_handler
      Description: >
        API de solo lectura: devuelve los trenes de hoy desde DynamoDB
        (datos en vivo/parciales del día en curso).
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrainStateTable
      Events:
        GetTodayApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrainsApi
            Path: /trains/today
            Method: GET
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  GetDayTrainsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "zamora-get-day-trains-${Environment}"
      CodeUri: ../lambdas/api/
      Handler: handler.get_day_handler
      Description: >
        API de solo lectura: devuelve los trenes de un día pasado desde el
        fichero JSONL del Data Lake en S3. Devuelve 404 si ese día aún no se
        ha volcado.
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DatalakeBucket
      Events:
        GetDayApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrainsApi
            Path: /trains/{date}
            Method: GET
      Tags:
        Project: ZamoraTrainObservability
        Environment: !Ref Environment

  # ── Frontend: hosting estático ──────────────────────────────────────────────
  # Sin CloudFront por ahora (decisión explícita para simplicidad en esta
  # alpha): se sirve directamente vía el endpoint de website hosting de S3.
  # Contenido público, no sensible (retrasos de trenes). A diferencia de
  # DatalakeBucket, este bucket se deja deliberadamente público.
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "zamora-trains-frontend-${Environment}-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html   # SPA fallback: cualquier ruta desconocida sirve index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  # ── CloudWatch: Alarma de retrasos grandes ──────────────────────────────────
  HighDelayAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: !Sub "ZamoraTrain-HighDelay-${Environment}"
      AlarmDescription: "Tren con retraso > 30 minutos en Zamora"
      Namespace: ZamoraTrains
      MetricName: TrainDelayMinutes
      Statistic: Maximum
      Period: 300                    # 5 minutos
      EvaluationPeriods: 1
      Threshold: 30
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub "zamora-trains-alerts-${Environment}"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmailAddress

  # ── AWS Glue: Data Catalog ─────────────────────────────────────────────────
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: "Data Lake de puntualidad de trenes en Zamora"

  # Tabla definida a mano (sin Crawler): las columnas deben coincidir
  # exactamente con las claves del JSON que escribe daily_dump_handler() en
  # handler.py. Las particiones (year/month/day) se resuelven mediante
  # Partition Projection, así que tampoco hace falta ALTER TABLE ADD PARTITION
  # ni ejecutar nada tras cada despliegue para que Athena vea los datos nuevos.
  TrainsTable:
    Type: AWS::Glue::Table
    DependsOn: GlueDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabaseName
      TableInput:
        Name: zamora_trains
        Description: "Eventos de paso/llegada de trenes por Zamora (Madrid/Galicia)"
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          "projection.enabled": "true"
          "projection.year.type": "integer"
          "projection.year.range": "2024,2035"
          "projection.month.type": "integer"
          "projection.month.range": "1,12"
          "projection.month.digits": "2"
          "projection.day.type": "integer"
          "projection.day.range": "1,31"
          "projection.day.digits": "2"
          "storage.location.template": !Sub "s3://${DatalakeBucket}/zamora-trains/year=${!year}/month=${!month}/day=${!day}/"
        PartitionKeys:
          - Name: year
            Type: string
          - Name: month
            Type: string
          - Name: day
            Type: string
        StorageDescriptor:
          Location: !Sub "s3://${DatalakeBucket}/zamora-trains/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              "ignore.malformed.json": "true"
          Columns:
            # Debe reflejar exactamente el dict `record` que construye
            # daily_dump_handler() en lambdas/train_tracker/handler.py.
            - Name: event_id
              Type: string
            - Name: cod_comercial
              Type: string
            - Name: sentido
              Type: string
            - Name: tipo_dia
              Type: string
            - Name: dia_semana
              Type: string
            - Name: hora_programada
              Type: string
            - Name: hora_llegada_corregida
              Type: string
            - Name: minutos_retraso
              Type: int
            - Name: cancelado
              Type: boolean

  # ── Athena: Workgroup ─────────────────────────────────────────────────────
  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "zamora-trains-${Environment}"
      Description: "Queries sobre el Data Lake de trenes Zamora"
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://${DatalakeBucket}/athena-results/"
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 1073741824   # 1 GB máximo por query

  # ── CloudWatch Dashboard ──────────────────────────────────────────────────
  TrainDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "ZamoraTrains-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "title": "Retraso medio diario (minutos)",
                "metrics": [
                  ["ZamoraTrains", "TrainDelayMinutes", "Sentido", "Madrid"],
                  ["ZamoraTrains", "TrainDelayMinutes", "Sentido", "Galicia"]
                ],
                "stat": "Average",
                "period": 86400,
                "view": "timeSeries",
                "region": "${AwsRegion}"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Trenes con retraso > 0 (por día)",
                "metrics": [
                  ["ZamoraTrains", "TrainsWithDelay"]
                ],
                "stat": "Sum",
                "period": 86400,
                "view": "timeSeries",
                "region": "${AwsRegion}"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Ejecuciones Lambda",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "zamora-train-tracker-${Environment}"],
                  ["AWS/Lambda", "Errors",      "FunctionName", "zamora-train-tracker-${Environment}"]
                ],
                "stat": "Sum",
                "period": 300,
                "region": "${AwsRegion}"
              }
            }
          ]
        }


# ══════════════════════════════════════════════════════════════════════════════
# OUTPUTS
# ══════════════════════════════════════════════════════════════════════════════
Outputs:
  DatalakeBucketName:
    Description: "Nombre del bucket S3 del Data Lake"
    Value: !Ref DatalakeBucket
    Export:
      Name: !Sub "${AWS::StackName}-DatalakeBucket"

  DynamoDBTableName:
    Description: "Tabla DynamoDB de estado de trenes"
    Value: !Ref TrainStateTable

  TrainTrackerFunctionArn:
    Description: "ARN de la Lambda principal"
    Value: !GetAtt TrainTrackerFunction.Arn

  AthenaWorkgroupName:
    Description: "Workgroup Athena para queries"
    Value: !Ref AthenaWorkgroup

  GlueDatabaseName:
    Description: "Base de datos Glue Data Catalog"
    Value: !Ref GlueDatabase

  DashboardURL:
    Description: "URL del CloudWatch Dashboard"
    Value: !Sub "https://${AwsRegion}.console.aws.amazon.com/cloudwatch/home#dashboards:name=ZamoraTrains-${Environment}"

  XApiCredentialsSecretName:
    Description: >
      Nombre del secret en Secrets Manager donde rellenar a mano las
      credenciales OAuth1.0a de la X Developer App tras el despliegue.
    Value: !Ref XApiCredentialsSecret

  TrainsApiBaseUrl:
    Description: "URL base del API HTTP de trenes (usar como VITE_API_BASE_URL)"
    Value: !Sub "https://${TrainsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  FrontendBucketName:
    Description: "Bucket S3 del frontend estático"
    Value: !Ref FrontendBucket

  FrontendWebsiteUrl:
    Description: "URL del sitio estático (S3 website hosting, sin CloudFront)"
    Value: !GetAtt FrontendBucket.WebsiteURL
